---
name: Temporary README Formatter Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Print exact README Prettier changes
        run: |
          npx --yes prettier@3.9.8 --write README.md
          git diff -- README.md
